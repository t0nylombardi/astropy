target-version = "py313"
line-length = 100
indent-width = 4

extend-exclude = [
  ".vscode",
  ".idea",
  "__pycache__",
  ".python-version",
  ".ruff.toml",
  "ruff.toml",
  "setup.cfg",
  "pyproject.toml"
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100

[lint]
# Enable broad, sane rule families
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear (logic traps)
  "SIM",  # simplify
  "UP",   # modern Python upgrades
  "C90",  # complexity
  "D"     # docstrings
]

ignore = [
  # Docstring relaxations (StandardRB style: not dogmatic)
  "D100",  # module docstring
  "D104",  # package docstring
  "D105",  # magic method docstring
  "D203",  # blank-line-before-class
  "D212",  # multi-line-summary-first-line

  # Allow pragmatic flexibility
  "E501",  # let formatter handle line length
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.pylint]
max-args = 5
max-positional-args = 5
max-bool-expr = 5
max-branches = 5
max-locals = 10
max-nested-blocks = 4
max-public-methods = 15
max-returns = 4
max-statements = 15

[lint.pydocstyle]
convention = "pep257"

[lint.mccabe]
max-complexity = 8
